<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citas médicas — Sistema Hospitalario Integrado</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/6.1.11/index.global.min.js"></script>
<style>
  :root { --navy:#1F4E78; --bg:#F4F6F8; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; margin: 0; background: var(--bg); color: #1a1a1a; }
  header { background: var(--navy); color: white; padding: 1rem 1.5rem; }
  header h1 { margin: 0; font-size: 1.3rem; }
  .layout { display: flex; gap: 1rem; padding: 1rem; align-items: flex-start; flex-wrap: wrap; }
  .panel { background: white; border-radius: 8px; padding: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  #calendar-wrap { flex: 1 1 600px; min-width: 320px; }
  #form-wrap { width: 280px; }
  label { display:block; font-size: .8rem; margin-top: .6rem; color:#444; }
  input, select { width: 100%; padding: .4rem; margin-top: .2rem; border: 1px solid #ccc; border-radius: 4px; }
  button { margin-top: 1rem; width: 100%; background: var(--navy); color: white; border: none; padding: .6rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
  button:hover { opacity: .9; }
  #msg { margin-top: .6rem; font-size: .85rem; padding: .5rem; border-radius: 4px; display:none; }
  #msg.ok { display:block; background:#e6f4ea; color:#1e7e34; }
  #msg.err { display:block; background:#fdecea; color:#c0392b; }
  .legend { display:flex; gap: .8rem; padding: 0 1rem 1rem; flex-wrap: wrap; font-size: .8rem; }
  .legend span { display:inline-flex; align-items:center; gap:.3rem; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  dialog { border:none; border-radius: 8px; padding: 1.2rem; width: 300px; box-shadow: 0 4px 20px rgba(0,0,0,.2); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog h3 { margin-top:0; }
  dialog button { margin-top: .5rem; }
</style>
</head>
<body>
<header><h1>Control de Citas — Sistema Hospitalario Integrado</h1></header>

<div class="legend">
  <span><i class="dot" style="background:#e0a800"></i> pendiente</span>
  <span><i class="dot" style="background:#28a745"></i> confirmada</span>
  <span><i class="dot" style="background:#c0392b"></i> cancelada</span>
  <span><i class="dot" style="background:#1F4E78"></i> atendida</span>
</div>

<div class="layout">
  <div id="calendar-wrap" class="panel"><div id="calendar"></div></div>

  <div id="form-wrap" class="panel">
    <h3 style="margin-top:0">Nueva cita</h3>
    <label>Filtrar calendario por doctor
      <select id="f-filtro-doctor"><option value="">Todos los doctores</option></select>
    </label>
    <label>Desde
      <input type="date" id="f-desde">
    </label>
    <label>Hasta
      <input type="date" id="f-hasta">
    </label>
    <button id="btn-filtrar" type="button">Aplicar filtro</button>
    <label>Doctor
      <select id="f-doctor"></select>
    </label>
    <label>Paciente
      <select id="f-paciente"></select>
    </label>
    <label>Fecha
      <input type="date" id="f-fecha">
    </label>
    <label>Hora inicio
      <input type="time" id="f-inicio">
    </label>
    <label>Hora fin
      <input type="time" id="f-fin">
    </label>
    <label>Motivo
      <input type="text" id="f-motivo" placeholder="Opcional">
    </label>
    <button id="btn-crear">Crear cita</button>
    <div id="msg"></div>
  </div>
</div>

<dialog id="dlg-detalle">
  <h3>Detalle de la cita</h3>
  <div id="dlg-body"></div>
  <label>Cambiar estado
    <select id="dlg-estado">
      <option value="pendiente">pendiente</option>
      <option value="confirmada">confirmada</option>
      <option value="cancelada">cancelada</option>
      <option value="atendida">atendida</option>
    </select>
  </label>
  <button id="dlg-guardar">Guardar estado</button>
  <button onclick="document.getElementById('dlg-detalle').close()" style="background:#888;margin-top:.4rem;">Cerrar</button>
</dialog>

<script>
const ESTADO_COLOR = { pendiente: '#e0a800', confirmada: '#28a745', cancelada: '#c0392b', atendida: '#1F4E78' };
let calendar;
let citaSeleccionadaId = null;

function showMsg(text, ok) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = ok ? 'ok' : 'err';
  setTimeout(() => { el.className = ''; }, 4000);
}

async function cargarSelect(url, selectId, labelFn) {
  const res = await fetch(url);
  const { data } = await res.json();
  const select = document.getElementById(selectId);
  select.innerHTML = data.map(item => `<option value="${item.id}">${labelFn(item)}</option>`).join('');
}

function cargarDoctores(data) {
  const options = data.map(item => `<option value="${item.id}">${labelDoctor(item)}</option>`).join('');
  document.getElementById('f-doctor').innerHTML = options;
  document.getElementById('f-filtro-doctor').insertAdjacentHTML('beforeend', options);
}

function labelDoctor(doctor) {
  return `${doctor.nombre} (${doctor.especialidad})`;
}

function citaToEvent(c) {
  return {
    id: String(c.id),
    title: `#${c.paciente_id} · ${c.motivo || 'Consulta'}`,
    start: `${c.fecha}T${c.hora_inicio}`,
    end: `${c.fecha}T${c.hora_fin}`,
    backgroundColor: ESTADO_COLOR[c.estado] || '#999',
    borderColor: ESTADO_COLOR[c.estado] || '#999',
    extendedProps: c,
  };
}

document.addEventListener('DOMContentLoaded', async () => {
  const doctores = await fetch('/api/doctores').then(res => res.json());
  cargarDoctores(doctores.data);
  await cargarSelect('/api/pacientes', 'f-paciente', p => p.nombre);

  calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
    initialView: 'timeGridWeek',
    headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
    editable: true,
    height: 650,
    events: async (info, success, failure) => {
      try {
        const params = new URLSearchParams({ desde: document.getElementById('f-desde').value || info.startStr.slice(0, 10), hasta: document.getElementById('f-hasta').value || info.endStr.slice(0, 10) });
        const doctorId = document.getElementById('f-filtro-doctor').value;
        if (doctorId) params.set('doctor_id', doctorId);
        const res = await fetch(`/api/citas?${params}`);
        const { data } = await res.json();
        success(data.map(citaToEvent));
      } catch (e) { failure(e); }
    },
    dateClick: (info) => {
      document.getElementById('f-fecha').value = info.dateStr.slice(0, 10);
      document.getElementById('f-inicio').focus();
    },
    eventClick: (info) => {
      const c = info.event.extendedProps;
      citaSeleccionadaId = c.id;
      document.getElementById('dlg-body').innerHTML = `
        <p><b>Fecha:</b> ${c.fecha}</p>
        <p><b>Hora:</b> ${c.hora_inicio} - ${c.hora_fin}</p>
        <p><b>Motivo:</b> ${c.motivo || '—'}</p>
        <p><b>Estado actual:</b> ${c.estado}</p>`;
      document.getElementById('dlg-estado').value = c.estado;
      document.getElementById('dlg-detalle').showModal();
    },
    eventDrop: async (info) => {
      const c = info.event;
      const fecha = c.start.toISOString().slice(0, 10);
      const horaInicio = c.start.toTimeString().slice(0, 5);
      const horaFin = c.end.toTimeString().slice(0, 5);
      try {
        const res = await fetch(`/api/citas/${c.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fecha, hora_inicio: horaInicio, hora_fin: horaFin }),
        });
        const payload = await res.json();
        if (!res.ok) {
          info.revert();
          showMsg(payload.message || 'No se pudo reprogramar (conflicto de horario).', false);
          return;
        }
        showMsg('Cita reprogramada correctamente.', true);
      } catch (e) {
        info.revert();
        showMsg('Error de red al reprogramar.', false);
      }
    },
  });
  calendar.render();

  document.getElementById('btn-filtrar').addEventListener('click', () => calendar.refetchEvents());

  document.getElementById('btn-crear').addEventListener('click', async () => {
    const payload = {
      doctor_id: document.getElementById('f-doctor').value,
      paciente_id: document.getElementById('f-paciente').value,
      fecha: document.getElementById('f-fecha').value,
      hora_inicio: document.getElementById('f-inicio').value,
      hora_fin: document.getElementById('f-fin').value,
      motivo: document.getElementById('f-motivo').value,
    };
    const res = await fetch('/api/citas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) {
      showMsg(data.message || 'No se pudo crear la cita.', false);
      return;
    }
    showMsg('Cita creada correctamente.', true);
    calendar.refetchEvents();
  });

  document.getElementById('dlg-guardar').addEventListener('click', async () => {
    const estado = document.getElementById('dlg-estado').value;
    const res = await fetch(`/api/citas/${citaSeleccionadaId}/estado`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ estado }),
    });
    if (res.ok) {
      document.getElementById('dlg-detalle').close();
      calendar.refetchEvents();
      showMsg('Estado actualizado.', true);
    } else {
      const data = await res.json();
      showMsg(data.message || 'No se pudo cambiar el estado.', false);
    }
  });
});
</script>
</body>
</html>
